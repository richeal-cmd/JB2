<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Story • Justyn & Bernadette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Playfair Display', serif; background: #f5e8d3; }
    .love-font { font-family: 'Dancing Script', cursive; }
    .polaroid {
      background: white;
      padding: 15px 15px 25px;
      box-shadow: 0 15px 25px -5px rgba(0,0,0,0.35);
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
    }
    .polaroid img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }
    .polaroid-wrapper {
      transition: transform 0.3s ease;
    }
    .polaroid-wrapper:hover {
      transform: scale(1.04) rotate(1deg);
    }
  </style>
</head>
<body class="min-h-screen pb-12">
  <div class="max-w-4xl mx-auto px-6 py-10">
    <div class="text-center mb-12">
      <h1 class="text-5xl love-font text-pink-600">Justyn & Bernadette</h1>
      <p class="text-2xl mt-2">Happy 1 Year Anniversary • 31 August</p>
    </div>

    <!-- Photo Booth -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-8">
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[-2deg]">
          <img src="JBphotos/photo1.jpeg" alt="">
        </div>
      </div>
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[3deg]">
          <img src="JBphotos/photo2.jpeg" alt="">
        </div>
      </div>
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[-4deg]">
          <img src="JBphotos/photo3.jpeg" alt="">
        </div>
      </div>
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[2deg]">
          <img src="JBphotos/photo4.jpeg" alt="">
        </div>
      </div>
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[-1deg]">
          <img src="JBphotos/photo5.jpeg" alt="">
        </div>
      </div>
      <div class="polaroid-wrapper">
        <div class="polaroid rotate-[3deg]">
          <img src="JBphotos/photo6.jpeg" alt="">
        </div>
      </div>
    </div>

    <!-- Add your envelope or letter section here if you want -->
  </div>
</body>
</html>
